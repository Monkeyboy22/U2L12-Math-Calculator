<!DOCTYPE html>
<html>

<head>

    <title>Math Calculations App</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <h1>Calculator</h1>

    <div class="calculator">

        <input type="text" id="display"
        placeholder="Enter a calculation">

        <div class="buttons">

            <button onclick="clearDisplay()">C</button>
            <button onclick="deleteLast()">DEL</button>
            <button onclick="appendValue('(')">(</button>
            <button onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')">-</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button onclick="appendValue(')')">)</button>
            <button onclick="calculate()">=</button>

        </div>

        <h2>Extra Functions</h2>

        <div class="extraButtons">

            <button onclick="roundNumber()">Round</button>

            <button onclick="squareNumber()">Square</button>

            <button onclick="squareRoot()">Square Root</button>

            <button onclick="multiplyPi()">Pi</button>

            <button onclick="cubeNumber()">Cube</button>

        </div>

        <p id="mathResult">Result:</p>

    </div>


    <div class="uploadSection">

        <h2>Upload a File</h2>

        <input type="file" id="fileToLoad">

        <button onclick="checkFileProperty()">
            Load File
        </button>

        <p id="Message"></p>

        <textarea id="fileInput" rows="5"
        placeholder="Uploaded file information"></textarea>

        <br><br>

        <button onclick="calculateStatistics()">
            Calculate Statistics
        </button>

        <h2>Statistics Results</h2>

        <p id="statsResult"></p>

    </div>


    <script src="saveText.js"></script>

    <script src="readTextArea.js"></script>

    <script src="script.js"></script>

</body>

</html>
