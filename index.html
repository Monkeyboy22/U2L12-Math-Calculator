<!DOCTYPE html>
<html>
<head>
    <title>Math Calculations App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Math Calculations App</h1>

    <h2>Number Calculator</h2>

    <label>First Number:</label>
    <input type="number" id="number1">

    <br><br>

    <label>Second Number:</label>
    <input type="number" id="number2">

    <br><br>

    <button onclick="addNumbers()">Addition (+)</button>
    <button onclick="subtractNumbers()">Subtraction (-)</button>
    <button onclick="multiplyNumbers()">Multiplication (*)</button>
    <button onclick="divideNumbers()">Division (/)</button>

    <br><br>

    <button onclick="roundNumber()">Round</button>
    <button onclick="squareNumber()">Square</button>
    <button onclick="squareRoot()">Square Root</button>
    <button onclick="multiplyPi()">Multiply by Pi</button>
    <button onclick="cubeNumber()">Power of 3</button>

    <p id="mathResult">Result will appear here.</p>

    <hr>

    <h2>Upload a File</h2>

    <input type="file" id="fileToLoad">

    <button onclick="checkFileProperty()">Load Selected</button>

    <p id="Message"></p>

    <textarea id="fileInput" rows="5" cols="40"
    placeholder="File contents will appear here"></textarea>

    <br><br>

    <button onclick="calculateStatistics()">
        Calculate Statistics
    </button>

    <h2>Statistics Results</h2>

    <p id="statsResult"></p>

    <script src="js/saveText.js"></script>
    <script src="js/readTextArea.js"></script>
    <script src="js/script.js"></script>

</body>
</html>
